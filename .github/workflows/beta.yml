name: Publish Beta

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test

      - name: Set beta version
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version.replace(/-.*$/, '')")
          BETA_VERSION="${CURRENT}-beta.${{ github.run_number }}.${{ github.run_attempt }}"
          npm version "$BETA_VERSION" --no-git-tag-version
          echo "beta_version=$BETA_VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure latest npm CLI
        run: npm install -g npm@latest

      - name: Publish beta to npm
        run: npm publish --tag beta --provenance --access public

      - name: Write job summary
        run: |
          echo "### Published Beta to npm" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** \`${{ steps.version.outputs.beta_version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Install:** \`npm install @guettonenrique/passwordless-auth@${{ steps.version.outputs.beta_version }}\`" >> "$GITHUB_STEP_SUMMARY"
