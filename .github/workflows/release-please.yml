name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node

      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci
        if: ${{ steps.release.outputs.release_created }}
      - run: npm run typecheck
        if: ${{ steps.release.outputs.release_created }}
      - run: npm run lint
        if: ${{ steps.release.outputs.release_created }}
      - run: npm run build
        if: ${{ steps.release.outputs.release_created }}
      - run: npm test
        if: ${{ steps.release.outputs.release_created }}

      - name: Ensure latest npm CLI (for npm stage publish)
        if: ${{ steps.release.outputs.release_created }}
        run: npm install -g npm@latest

      - name: Stage release on npm
        if: ${{ steps.release.outputs.release_created }}
        run: npm stage publish --provenance
